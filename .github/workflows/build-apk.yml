name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies and add Android platform
        run: |
          npm install
          npx cap init "Google Pay" "com.example.googlepay" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Add Camera permission to AndroidManifest.xml
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          perm = "<uses-permission android:name=\"android.permission.CAMERA\" />"
          if perm not in txt:
              txt = txt.replace("<application", perm + "\n    <application", 1)
          p.write_text(txt, encoding="utf-8")
          '

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-pay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
